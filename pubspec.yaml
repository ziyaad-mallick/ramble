name: ramble
description: "Ramble — we'll make sense of it. A voice note app with a character at its core."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^10.0.0
  google_fonts: ^6.2.1
  collection: ^1.18.0
  flutter_animate: ^4.5.0
  record: ^7.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_gemma: ^0.16.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# App icon = Miko's face (assets/miko.png). Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/miko.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FAF5F0"
  adaptive_icon_foreground: "assets/miko.png"

flutter:
  uses-material-design: true
  assets:
    - assets/miko.png
    - assets/miko_logo.png
